<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img">
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#f6f7fb}.m{font-family:'Courier New',monospace}
.w{fill:#f6f7fb}.muted{fill:#9eabc0}.blue{fill:#247bff}.red{fill:#ff354f}
.card{fill:#0b1324;stroke:#263754;stroke-width:1.5}.chip{fill:#101d33;stroke:#31527e}
.dh-dh-h1{font-size:62px;font-weight:900;fill:#f6f7fb}.dh-dh-h2{font-size:34px;font-weight:900;fill:#f6f7fb}.dh-dh-h3{font-size:20px;font-weight:800;fill:#f6f7fb}
.dh-dh-body{font-size:19px;fill:#f6f7fb}.dh-dh-small{font-size:15px;fill:#f6f7fb}.dh-dh-tiny{font-size:12px;fill:#f6f7fb}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes rise{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite}.rise{animation:rise .9s ease-out both}
@media(prefers-reduced-motion:reduce){.pulse,.drift,.rise{animation:none}}
text{fill:#f6f7fb} text.blue{fill:#247bff} text.red{fill:#ff354f} text.muted{fill:#9eabc0}</style>

<defs>
<linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#247bff" stop-opacity=".32"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
<filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1200" height="520" rx="28" fill="#070b16"/>

<text x="48" y="55" class="m blue dh-small">03 / STACK</text>
<text x="48" y="105" class="t dh-h2">THE TOOLS IN MY ORBIT</text>
<text x="48" y="135" class="muted dh-small">Programming • MarTech • Cloud • Visualization</text>
<g transform="translate(610 285)">
<ellipse rx="465" ry="150" fill="none" stroke="#247bff" stroke-opacity=".55" stroke-width="2" transform="rotate(-8)"/>
<ellipse rx="355" ry="108" fill="none" stroke="#ff354f" stroke-opacity=".45" stroke-width="2" transform="rotate(12)"/>
<ellipse rx="245" ry="70" fill="none" stroke="#247bff" stroke-opacity=".45" stroke-width="2" transform="rotate(-18)"/>
<circle r="58" fill="#0e1c33" stroke="url(#grad)" stroke-width="3" class="pulse"/>
<text y="-4" text-anchor="middle" class="t dh-h3">DATA</text><text y="22" text-anchor="middle" class="blue dh-small">+ MARTECH</text>
<g class="t dh-h3">
<text x="-420" y="-65">Python</text><text x="-290" y="-132">SQL</text><text x="-80" y="-165">PySpark</text>
<text x="115" y="-158">AEP</text><text x="275" y="-95">AJO</text><text x="410" y="-15">SFMC</text>
<text x="350" y="90">Power BI</text><text x="185" y="145">Tableau</text><text x="-5" y="165">Azure</text>
<text x="-190" y="145">ADF</text><text x="-340" y="92">GA4</text><text x="-440" y="12">JavaScript</text>
</g></g>
<rect x="48" y="395" width="1104" height="68" rx="18" class="card"/>
<text x="76" y="425" class="blue dh-small">GROUPED STACK</text>
<text x="76" y="451" class="muted dh-small">Python · SQL · PySpark · AEP · AJO · SFMC · Adobe Campaign · Azure · ADF · Power BI · Tableau · GA4 · JavaScript · REST APIs</text>
</svg>